<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moja flotila</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    header {
      background: #172554;
      color: white;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 8px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }
    .value {
      font-size: 25px;
      font-weight: bold;
      margin-top: 10px;
    }
    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>🚚 Moja flotila</h1>
  <p>Prehľad príjmov, nákladov a zisku</p>
</header>

<div class="cards">
  <div class="card">
    <div>Počet vozidiel</div>
    <div class="value">3</div>
  </div>

  <div class="card">
    <div>Celkové príjmy</div>
    <div class="value">0 Kč</div>
  </div>

  <div class="card">
    <div>Celkové náklady</div>
    <div class="value">0 Kč</div>
  </div>

  <div class="card">
    <div>Zisk flotily</div>
    <div class="value">0 Kč</div>
  </div>
</div>

<div class="section">

  <p>Tu budeme evidovať tvoje tri autá.</p>
</div>

<div class="section">
  <h2>Príjmy a náklady</h2>

</div>
